[pytest]
# Tests live in tests/ and are named tests_*.py (not the pytest default
# test_*.py). Declaring both here means a bare `pytest` now collects the whole
# suite — previously the files sat at the repo root with no python_files
# override, so `pytest` silently collected NOTHING and every run had to spell
# out the filenames. A test command that quietly runs zero tests is worse than
# one that fails.
testpaths = tests
python_files = tests_*.py test_*.py

markers =
    live: marks tests that make live LLM or FMP/API calls (deselect with -m "not live")
